[workspace]
resolver = "2"
members = [
    "crates/proteus-core",
    "crates/proteus-wasm",
    "crates/proteus-cli",
    "crates/roaring-landmask-tiler"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3"

[workspace.dependencies]
# --- Shared across all crates ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
half = "2.4"
roaring = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# --- Core-only (pure Rust, no target-specific deps) ---
rand = "0.8"
rand_distr = "0.4"

# --- WASM-only ---
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
gloo-net = { version = "0.5", features = ["http"] }
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

# --- CLI-only ---
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
csv = "1.3"

# --- Logging façade (used by core) ---
log = "0.4"

# --- Native async utilities (optional, CLI) ---
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true