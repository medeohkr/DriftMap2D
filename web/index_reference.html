

            </div>
        </div>
        <div class="sidebar-border"></div>
    </div>
    <span id="current-day"></span>
    <div id="timeline-container" class="timeline-container" style="display:none;">
        <div class="timeline-controls">
            <button id="timeline-rewind" class="timeline-btn">
                <img src="assets/images/RewindBtn.webp" style="width: 12px;">
            </button>
            <button id="timeline-play" class="timeline-btn">▶</button>
            <button id="timeline-pause" class="timeline-btn" style="display:none;">
                <img src="assets/images/PauseBtn.webp" style="width: 9px; height: 10px;">
            </button>
            <button id="timeline-speed" class="timeline-btn">1x</button>
        </div>
        <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="0" value="0">
        <div class="timeline-labels">
            <span id="timeline-start">Day 0</span>
            <span id="timeline-current">Day 0</span>
            <span id="timeline-end">Day 0</span>
        </div>
    </div>

    
    <div class="stats-container" id="stats-container">
        <div class="container-secondary">
            <span class="stats-primary-text">Stranded</span>
            <span class="unit-text" id="stranded">0%</span>
        </div>
        <div class="container-secondary">
            <span class="stats-primary-text">Emulsified</span>
            <span class="unit-text" id="emulsified">0%</span>
        </div>
        <div class="container-secondary">
            <span class="stats-primary-text">Evaporated</span>
            <span class="unit-text" id="evaporated">0%</span>
        </div>
        <div class="container-secondary">
            <span class="stats-primary-text">Total Floating Mass</span>
            <span class="unit-text" id="total-mass">0 t</span>
        </div>
    </div>
    <div class="legend-collapse-container">
        <button class="legend-collapse-button" id="legend-collapse" hidden>&gt;</button>
        <button class="legend-collapse-button" id="legend-open" hidden>&lt;</button>
    </div>
    
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>
</body>
</html>
